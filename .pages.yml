# Pages CMS (https://pagescms.org) — lets non-engineers edit tours, columns, prices and FAQ in a web form.
# Log in at https://app.pagescms.org with the GitHub account that owns this repository.
media:
  input: public/images
  output: /images
content:
  - name: tours
    label: Tours
    type: collection
    path: src/content/tours
    view:
      fields: [title, area, draft]
    fields:
      - { name: title, label: Title (full), type: string, required: true }
      - { name: shortTitle, label: Short title (cards), type: string, required: true }
      - { name: summary, label: Summary (1-2 sentences), type: text, required: true }
      - name: area
        label: Area
        type: select
        options: { values: [Shinjuku, Ueno, Asakusa, Osaka] }
      - name: themes
        label: Themes
        type: select
        list: true
        options: { values: [Entertainment, Culture, Food, Shopping, Nightlife, FourSeasons, E-Scooter, History, JapaneseCustoms, Walk] }
      - { name: durationMinutes, label: Duration (minutes), type: number, default: 60 }
      - { name: language, label: Language, type: string, default: English }
      - { name: startTimes, label: Start times (free text), type: string }
      - { name: bookingDeadline, label: Booking deadline, type: string }
      - { name: ageNote, label: Age note, type: string }
      - { name: heroImage, label: Main photo, type: image }
      - { name: heroAlt, label: Main photo description, type: string }
      - name: meetingPoint
        label: Meeting point
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: access, label: How to get there, type: text }
          - { name: lookFor, label: How to find the guide, type: string }
          - { name: mapUrl, label: Google Maps URL, type: string }
          - { name: image, label: Meeting point photo, type: image }
          - { name: imageAlt, label: Meeting point photo description, type: string }
      - { name: hook, label: Hook (one line under the title on social/SEO), type: string }
      - { name: tagline, label: Big catchphrase (max ~5 words), type: string }
      - name: pattern
        label: Crest pattern (one per tour)
        type: select
        options: { values: [seigaiha, asanoha, yagasuri, kikko, uroko, shippo, ichimatsu, tatewaku] }
      - name: features
        label: What you'll do (icon + 2-4 words)
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options: { values: [torii, lantern, sake, camera, stamp, brush, bag, knife, bowl, glass, sakura, dango, rainbow, scooter, yen, city, chat, cup, pin, clock, group, kid, mask, shuriken] }
          - { name: label, label: Label, type: string }
      - name: itinerary
        label: Itinerary
        type: object
        list: true
        fields:
          - { name: title, label: Step (with minutes), type: string }
          - { name: text, label: Description (optional), type: text }
      - { name: itineraryNote, label: Note under itinerary, type: text }
      - name: story
        label: Chapters (photo + short catch)
        type: object
        list: true
        fields:
          - { name: title, label: Catch (max ~5 words), type: string }
          - { name: text, label: One short sentence, type: text }
          - { name: image, label: Photo, type: image }
          - { name: imageAlt, label: Photo description, type: string }
      - name: gallery
        label: Photo gallery
        type: object
        list: true
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: Photo description, type: string }
      - name: faq
        label: FAQ for this tour (meeting point, times, price, language and booking are added automatically)
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: materialCostPerPerson, label: Materials fee per person (JPY), type: number, default: 0 }
      - { name: fixedPricePerPerson, label: Flat price per person (JPY, only for tours outside the group tiers), type: number }
      - { name: privateTour, label: Private tour (one group per guide), type: boolean, default: true }
      - { name: bookingUrl, label: Booking URL (LINKTIVITY), type: string }
      - name: otaLinks
        label: Review links (OTA)
        type: object
        list: true
        fields:
          - { name: name, label: Site name, type: string }
          - { name: url, label: URL, type: string }
      - { name: seasonal, label: Seasonal note, type: string }
      - { name: order, label: Display order (small = first), type: number, default: 100 }
      - { name: draft, label: Draft (hidden on live site), type: boolean, default: true }
      - { name: body, label: Description, type: rich-text }
  - name: columns
    label: Tokyo Guide (columns)
    type: collection
    path: src/content/columns
    view:
      fields: [title, publishedAt, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description (for Google), type: text, required: true }
      - { name: publishedAt, label: Published date, type: date }
      - { name: area, label: Area, type: string }
      - { name: heroImage, label: Main photo, type: image }
      - { name: relatedTours, label: Related tours (file names without .md), type: string, list: true }
      - { name: draft, label: Draft (hidden on live site), type: boolean, default: true }
      - { name: body, label: Article, type: rich-text }
  - name: pricing
    label: Prices
    type: file
    path: src/data/pricing.json
    format: json
    fields:
      - { name: currency, label: Currency, type: string }
      - { name: usdRate, label: JPY per USD (for approx. USD), type: number }
      - name: tiers
        label: Price tiers
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: minGuests, label: Min guests, type: number }
          - { name: maxGuests, label: Max guests (99 = no limit), type: number }
          - { name: pricePerPerson, label: Price per adult (JPY), type: number }
      - { name: childPolicy, label: Child policy, type: text }
      - { name: note, label: Note under price table, type: text }
  - name: reviews
    label: Guest reviews
    type: file
    path: src/data/reviews.json
    format: json
    fields:
      - { name: asOf, label: Checked on (YYYY-MM-DD), type: string }
      - { name: note, label: Selection note shown under reviews, type: text }
      - name: ratings
        label: Rating badges
        type: object
        list: true
        fields:
          - { name: source, label: Site, type: string }
          - { name: score, label: Score, type: number }
          - { name: count, label: Number of reviews, type: number }
          - { name: label, label: Listing name (optional), type: string }
          - { name: url, label: URL, type: string }
      - name: items
        label: Review excerpts (quote exactly, do not edit wording)
        type: object
        list: true
        fields:
          - { name: text, label: Excerpt, type: text }
          - { name: author, label: Initials, type: string }
          - { name: source, label: Site, type: string }
          - { name: stars, label: Stars, type: number }
          - { name: tour, label: Tour (optional), type: string }
  - name: faq
    label: FAQ
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - { name: q, label: Question, type: string }
      - { name: a, label: Answer, type: text }
