# Updates the Google star rating and review count on the site every morning (scripts/update-ratings.ts).
# Commits only when the numbers changed; the push triggers a Netlify rebuild.
# Setup: secret GOOGLE_MAPS_API_KEY (Places API (New) enabled). Optional variable GOOGLE_PLACE_ID
# (the first run prints it). Optional variable COLUMN_BRANCH = branch to write to.
name: Daily Google rating

on:
  schedule:
    - cron: '17 21 * * *' # 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.COLUMN_BRANCH || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rating
        id: rating
        run: node scripts/update-ratings.ts
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}

      - name: Commit
        if: steps.rating.outputs.changed == 'true'
        run: |
          git config user.name "ngt-rating-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json
          git commit -m "Google rating update"
          git push origin HEAD:${{ vars.COLUMN_BRANCH || github.ref_name }}
